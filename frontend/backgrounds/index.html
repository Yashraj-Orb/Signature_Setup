<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type"
      content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbrick — Background Generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Solway:wght@800&display=swap"
      rel="stylesheet">
    <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PT Sans',Tahoma,sans-serif;background:#dedad4;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 36px;gap:18px;}
.tool-nav{width:100%;max-width:1060px;display:flex;align-items:center;justify-content:space-between;}
.tool-nav img{display:block;width:180px;height:auto;}
.tool-nav a:last-child{color:#5B2A86;font-size:12px;font-weight:700;text-decoration:none;}.tool-nav a:last-child:hover{color:#f08519;}
.panel{background:#fff;border-radius:18px;padding:16px 22px;width:100%;max-width:1060px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;box-shadow:0 2px 20px rgba(0,0,0,0.09);}
.panel-logo img{height:40px;width:auto;display:block;}
.fields{display:flex;gap:14px;flex:1;flex-wrap:wrap;}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:180px;}
.fg label{font-size:10px;font-weight:700;color:#5B2A86;text-transform:uppercase;letter-spacing:1px;}
.fg input{border:1.5px solid #e0dbd8;border-radius:9px;padding:9px 13px;font-family:'PT Sans',sans-serif;font-size:15px;color:#141413;background:#faf9f6;outline:none;transition:border-color 0.18s,box-shadow 0.18s;}
.fg input:focus{border-color:#f08519;box-shadow:0 0 0 3px rgba(240,133,25,0.14);}
.fg input[readonly]{background:#f0ede8;color:#9a9590;cursor:not-allowed;border-color:#e0dbd8;}
.fg input[readonly]:focus{border-color:#e0dbd8;box-shadow:none;}
.fg input::placeholder{color:#b0aba5;}
.btn-dl{background:#f08519;border:none;border-radius:10px;color:#fff;font-family:'PT Sans',sans-serif;font-size:13.5px;font-weight:700;padding:11px 22px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;transition:background 0.15s,transform 0.1s;box-shadow:0 2px 10px rgba(240,133,25,0.28);}
.btn-dl:hover{background:#d9730d;}
.btn-dl:active{transform:scale(0.97);}
.btn-dl svg{width:15px;height:15px;flex-shrink:0;}
.canvas-wrap{width:100%;max-width:1060px;border-radius:16px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,0.18);}
canvas{display:block;width:100%;height:auto;}
.hint{font-size:11.5px;color:#9a9590;letter-spacing:0.3px;}
.bg-selector-wrap{width:100%;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1.5px solid #f0ede6;}
.bg-selector-label,.stat-section-label{font-size:10px;font-weight:700;color:#5B2A86;text-transform:uppercase;letter-spacing:1px;}
.bg-selector{display:flex;gap:10px;flex-wrap:wrap;}
.bg-thumb{cursor:pointer;border-radius:10px;overflow:hidden;border:3px solid transparent;transition:border-color 0.2s,transform 0.12s;flex-shrink:0;}
.bg-thumb:hover{transform:scale(1.05);}
.bg-thumb.active{border-color:#f08519;box-shadow:0 0 0 2px rgba(240,133,25,0.25);}
.bg-thumb img{display:block;width:150px;height:85px;object-fit:cover;background:#e0dbd8;}
.stat-section{width:100%;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1.5px solid #f0ede6;}
.stat-rows{display:flex;flex-direction:column;gap:8px;}
.stat-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.stat-num-fg{flex:0 0 88px!important;min-width:0!important;}
.btn-upload-bg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:#f4f1ec;border:1.5px dashed #c8c2bb;border-radius:10px;color:#5B2A86;font-family:'PT Sans',sans-serif;font-size:12.5px;font-weight:700;padding:8px 14px;margin-top:6px;transition:background 0.15s,border-color 0.15s;white-space:nowrap;}.btn-upload-bg:hover{background:#ede8e0;border-color:#f08519;color:#f08519;}
.stat-desc-fg{flex:1!important;min-width:160px!important;}
.badge-group-label{font-size:10px;font-weight:700;color:#f08519;text-transform:uppercase;letter-spacing:1px;padding-top:6px;}
.badge-label-fg{flex:0 0 100px!important;min-width:0!important;}
</style>
  </head>
  <body>
    <nav class="tool-nav" aria-label="Tools"><a href="/" aria-label="Orbrick home"><img src="https://orbrick.com/wp-content/uploads/2024/08/Main-logoTransparent.png" alt="Orbrick"></a><a href="/">All tools</a></nav>
    <div class="panel">
      <div class="fields">
        <div class="fg"><label>Full Name</label><input id="inp-name" type="text"
            placeholder="e.g. Jane Smith" value
            maxlength="26"></div>
        <div class="fg"><label>Title / Position (optional)</label><input
            id="inp-title" type="text" placeholder="e.g. Founder &amp; CEO"
            maxlength="44"></div>
      </div>
      <div class="bg-selector-wrap">
        <div class="bg-selector-label">Choose Background</div>
        <div class="bg-selector" id="bg-selector"></div>
        <label class="btn-upload-bg" title="Add your own background image"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            style="width:14px;height:14px;flex-shrink:0"><line x1="12" y1="5"
              x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
          Add Image<input type="file" id="bg-upload" accept="image/*"
            style="display:none"></label>
      </div>
      <div class="stat-section">
        <div class="stat-section-label">Customise Stats</div>
        <div class="stat-rows">
          <div class="stat-row">
            <div class="fg stat-num-fg"><label>Stat 1 #</label><input
                id="stat-num-0" type="text" value="300K" maxlength="8"></div>
            <div class="fg stat-desc-fg"><label>Description</label><input
                id="stat-desc-0" type="text"
                value="Life hours saved ( of our 1 Billion Vision)"
                maxlength="100"></div>
          </div>
          <div class="stat-row">
            <div class="fg stat-num-fg"><label>Stat 2 #</label><input
                id="stat-num-1" type="text" value="85+" maxlength="8"></div>
            <div class="fg stat-desc-fg"><label>Description</label><input
                id="stat-desc-1" type="text" value="Purpose driven consultants"
                maxlength="100"></div>
          </div>
          <div class="stat-row">
            <div class="fg stat-num-fg"><label>Stat 3 #</label><input
                id="stat-num-2" type="text" value="80+" maxlength="8"></div>
            <div class="fg stat-desc-fg"><label>Description</label><input
                id="stat-desc-2" type="text"
                value="Outcomes delivered as a service" maxlength="100"></div>
          </div>
          <div class="stat-row">
            <div class="fg stat-num-fg"><label>Stat 4 #</label><input
                id="stat-num-3" type="text" value="20+" maxlength="8"></div>
            <div class="fg stat-desc-fg"><label>Description</label><input
                id="stat-desc-3" type="text"
                value="Enterprise clients reclaiming cash &amp; time through our products &amp; services"
                maxlength="100"></div>
          </div>
        </div>
      </div>
      <button class="btn-dl" id="btn-dl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round"><path
            d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline
            points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12"
            y2="3"></line></svg>
        Download PNG (1920x1080)
      </button>
    </div>
    <div class="canvas-wrap"><canvas id="bg" width="1920"
        height="1080"></canvas></div>
    <p class="hint">1920 x 1080 · Zoom · Microsoft Teams · Google Meet ·
      Webex</p>

const BG_FILES=["1 - Copy.png", "1.png", "10.png", "11.png", "12.png", "2 - Copy.png", "2.png", "3 - Copy.png", "3.png", "4 - Copy.png", "4.png", "5 - Copy.png", "5.png", "6 - Copy.png", "6.png", "7 - Copy.png", "7.png"];
const BG_IMGS=[];
(function(){
  const sel=document.getElementById('bg-selector');
  const thumbDivs=BG_FILES.map((name,idx)=>{
    const d=document.createElement('div');
    d.className='bg-thumb'+(idx===0?' active':'');
    d.onclick=()=>selectBg(idx);
    sel.appendChild(d);
    return d;
  });
  BG_FILES.forEach((name,idx)=>{
    const src=`Background_images/${name}`;
    const im=new Image();
    BG_IMGS[idx]=im;
    im.onload=()=>{
      const img=document.createElement('img');img.src=src;img.alt=name;
      thumbDivs[idx].appendChild(img);
      if(idx===0)render();
    };
    im.src=src;
  });
})();
let selectedBg=0;
function selectBg(idx){selectedBg=idx;document.querySelectorAll('#bg-selector .bg-thumb').forEach((el,i)=>el.classList.toggle('active',i===idx));render();}
function initThumbnails(){}
function addBackground(dataURL){const im=new Image();im.src=dataURL;im.onload=()=>{BG_IMGS.push(im);const idx=BG_IMGS.length-1;const sel=document.getElementById('bg-selector');const d=document.createElement('div');d.className='bg-thumb';d.onclick=()=>selectBg(idx);const img=document.createElement('img');img.src=dataURL;img.alt='Background '+(idx+1);d.appendChild(img);sel.appendChild(d);selectBg(idx);};}

// Recolor grey-on-black wreath image to purple-on-transparent
let tintedBadges=null;
function tintPurple(img){
  const c=document.createElement('canvas');c.width=c.height=300;
  const t=c.getContext('2d');t.drawImage(img,0,0,300,300);
  const id=t.getImageData(0,0,300,300),d=id.data;
  for(let i=0;i<d.length;i+=4){
    const v=d[i];
    if(v<30){d[i+3]=0;}
    else{d[i]=91;d[i+1]=42;d[i+2]=134;d[i+3]=Math.round(v*0.65);}
  }
  t.putImageData(id,0,0);return c;
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function dotGrid(ox,oy,cols,rows,gap,r,alpha){
  ctx.fillStyle=`rgba(91,42,134,${alpha})`;
  for(let c=0;c<cols;c++)for(let ro=0;ro<rows;ro++){
    ctx.beginPath();ctx.arc(ox+c*gap,oy+ro*gap,r,0,Math.PI*2);ctx.fill();
  }
}

// ── Badge icons (drawn inside wreath circle) ──
function badgeIcon(cx,cy,R,type){
  ctx.save();ctx.strokeStyle=PURPLE;ctx.lineWidth=R*0.06;ctx.lineCap='round';ctx.lineJoin='round';
  if(type==='star'){
    ctx.beginPath();
    for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,d=i%2?R*0.14:R*0.32;i?ctx.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d):ctx.moveTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d);}
    ctx.closePath();ctx.stroke();
  }else if(type==='trophy'){
    ctx.beginPath();ctx.arc(cx,cy-R*0.06,R*0.22,Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.22,cy-R*0.06);ctx.lineTo(cx-R*0.22,cy+R*0.08);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.22,cy-R*0.06);ctx.lineTo(cx+R*0.22,cy+R*0.08);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy+R*0.16);ctx.lineTo(cx,cy+R*0.30);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.16,cy+R*0.30);ctx.lineTo(cx+R*0.16,cy+R*0.30);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.22,cy-R*0.06);ctx.quadraticCurveTo(cx-R*0.40,cy,cx-R*0.40,cy+R*0.12);ctx.quadraticCurveTo(cx-R*0.40,cy+R*0.22,cx-R*0.22,cy+R*0.08);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.22,cy-R*0.06);ctx.quadraticCurveTo(cx+R*0.40,cy,cx+R*0.40,cy+R*0.12);ctx.quadraticCurveTo(cx+R*0.40,cy+R*0.22,cx+R*0.22,cy+R*0.08);ctx.stroke();
  }else if(type==='medal'){
    ctx.beginPath();ctx.arc(cx,cy+R*0.08,R*0.22,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();
    for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,d=i%2?R*0.06:R*0.11;i?ctx.lineTo(cx+Math.cos(a)*d,cy+R*0.08+Math.sin(a)*d):ctx.moveTo(cx+Math.cos(a)*d,cy+R*0.08+Math.sin(a)*d);}
    ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.14,cy-R*0.12);ctx.lineTo(cx-R*0.05,cy-R*0.30);ctx.lineTo(cx+R*0.05,cy-R*0.30);ctx.lineTo(cx+R*0.14,cy-R*0.12);ctx.stroke();
  }else if(type==='globe'){
    ctx.beginPath();ctx.arc(cx,cy,R*0.28,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,R*0.13,R*0.28,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.28,cy);ctx.lineTo(cx+R*0.28,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.24,cy-R*0.14);ctx.quadraticCurveTo(cx,cy-R*0.20,cx+R*0.24,cy-R*0.14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.24,cy+R*0.14);ctx.quadraticCurveTo(cx,cy+R*0.20,cx+R*0.24,cy+R*0.14);ctx.stroke();
  }
  ctx.restore();
}
const BADGE_ICONS=['star','trophy','medal','globe'];

// ── Stat icons (drawn inside orange circle) ──
function statIcon(cx,cy,R,type){
  ctx.save();ctx.strokeStyle=PURPLE;ctx.lineWidth=R*0.07;ctx.lineCap='round';ctx.lineJoin='round';
  if(type==='people'){
    ctx.beginPath();ctx.arc(cx,cy-R*0.12,R*0.18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx-R*0.34,cy-R*0.16,R*0.12,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+R*0.34,cy-R*0.16,R*0.12,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.44,cy+R*0.36);ctx.quadraticCurveTo(cx-R*0.44,cy+R*0.06,cx-R*0.20,cy+R*0.06);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.44,cy+R*0.36);ctx.quadraticCurveTo(cx+R*0.44,cy+R*0.06,cx+R*0.20,cy+R*0.06);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.44,cy+R*0.36);ctx.quadraticCurveTo(cx,cy+R*0.02,cx+R*0.44,cy+R*0.36);ctx.stroke();
  }else if(type==='target'){
    ctx.beginPath();ctx.arc(cx,cy,R*0.32,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,R*0.18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.12,cy-R*0.12);ctx.lineTo(cx+R*0.38,cy-R*0.38);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.25,cy-R*0.44);ctx.lineTo(cx+R*0.44,cy-R*0.44);ctx.lineTo(cx+R*0.44,cy-R*0.25);ctx.stroke();
  }else if(type==='star'){
    ctx.beginPath();
    for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,d=i%2?R*0.12:R*0.26;i?ctx.lineTo(cx+Math.cos(a)*d,cy-R*0.06+Math.sin(a)*d):ctx.moveTo(cx+Math.cos(a)*d,cy-R*0.06+Math.sin(a)*d);}
    ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.32,cy+R*0.28);ctx.quadraticCurveTo(cx,cy+R*0.15,cx+R*0.32,cy+R*0.28);ctx.stroke();
    ctx.beginPath();ctx.arc(cx-R*0.22,cy+R*0.38,R*0.07,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+R*0.22,cy+R*0.38,R*0.07,0,Math.PI*2);ctx.stroke();
  }else if(type==='db'){
    ctx.beginPath();ctx.ellipse(cx,cy-R*0.20,R*0.28,R*0.10,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R*0.28,cy-R*0.20);ctx.lineTo(cx-R*0.28,cy+R*0.20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+R*0.28,cy-R*0.20);ctx.lineTo(cx+R*0.28,cy+R*0.20);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy+R*0.20,R*0.28,R*0.10,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,R*0.28,R*0.10,0,Math.PI,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
const STAT_ICONS=['people','target','star','db'];

const BADGES=[
  {line1:'Business Transformation',line2:'Advisory Partner of',bold:'the Year 2026'},
  {line1:'Business Transformation',line2:'Advisory Partner of',bold:'the Year 2025'},
  {line1:'GenAI & Innovation',line2:'Partner of the Year',bold:'2025'},
  {line1:'International Partner of',line2:'',bold:'the Year 2026'},
];
const STATS=[
  {num:'100+',desc:['Collective Years of','Experience of our','Core Team in the Past']},
  {num:'80+', desc:['Purpose Driven','Consultants']},
  {num:'80+', desc:['Outcomes Delivered','as a Service']},
  {num:'15+', desc:['Oracle Projects','Executed']},
];

function wrapText(text,maxW){const words=text.split(' ');const lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else{line=t;}}if(line)lines.push(line);return lines.slice(0,3);}
function getStats(){const defs=[{num:'100+',desc:'collective years of experience of our core team'},{num:'80+',desc:'purpose driven consultants'},{num:'80+',desc:'outcomes delivered as a service'},{num:'15+',desc:'oracle projects executed'}];return defs.map((d,i)=>({num:(document.getElementById('stat-num-'+i)?.value.trim()||d.num),descText:(document.getElementById('stat-desc-'+i)?.value.trim()||d.desc)}));}
function getBadges(){const defs=[{label:'UKOUG',line1:'Business Transformation',line2:'Advisory Partner of',bold:'the Year 2026'},{label:'UKOUG',line1:'Business Transformation',line2:'Advisory Partner of',bold:'the Year 2025'},{label:'UKOUG',line1:'GenAI & Innovation',line2:'Partner of the Year',bold:'2025'},{label:'UKOUG',line1:'International Partner of',line2:'',bold:'the Year 2026'}];return defs.map((d,i)=>({label:(document.getElementById('badge-label-'+i)?.value.trim()||d.label),line1:(document.getElementById('badge-line1-'+i)?.value.trim()||d.line1),line2:(document.getElementById('badge-line2-'+i)?.value||''),bold:(document.getElementById('badge-bold-'+i)?.value.trim()||d.bold)}));}

function render(){
  // Tint wreaths once
  if(!tintedBadges&&BADGE_IMGS[0].complete&&BADGE_IMGS[0].naturalWidth>0)
    tintedBadges=BADGE_IMGS.map(im=>tintPurple(im));

  const name=document.getElementById('inp-name').value.trim();
  const title=document.getElementById('inp-title').value.trim();
  ctx.clearRect(0,0,W,H);

  // ── BACKGROUND ──
  const bgImg=BG_IMGS[selectedBg];
  if(bgImg&&bgImg.complete&&bgImg.naturalWidth>0){
    ctx.drawImage(bgImg,0,0,W,H);
  }else{
    // Warm off-white base (fallback / while images load)
    const bgGrad=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.7);
    bgGrad.addColorStop(0,'#f5f2ec');
    bgGrad.addColorStop(1,'#ebe7e0');
    ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

    // Orange top-right triangle
    ctx.save();ctx.fillStyle=ORANGE;
    ctx.beginPath();ctx.moveTo(W*0.71,0);ctx.lineTo(W,0);ctx.lineTo(W,H*0.32);ctx.closePath();ctx.fill();
    // Inner lighter orange triangle
    ctx.fillStyle='rgba(240,133,25,0.5)';
    ctx.beginPath();ctx.moveTo(W*0.78,0);ctx.lineTo(W,0);ctx.lineTo(W,H*0.22);ctx.closePath();ctx.fill();
    ctx.restore();

    // Purple bottom-left blob
    ctx.save();ctx.fillStyle=PURPLE;
    ctx.beginPath();
    ctx.moveTo(0,H*0.72);
    ctx.bezierCurveTo(W*0.06,H*0.66,W*0.16,H*0.74,W*0.14,H*0.84);
    ctx.bezierCurveTo(W*0.11,H*0.94,W*0.04,H,0,H);
    ctx.closePath();ctx.fill();ctx.restore();

    // Orange swirl curves bottom-left
    ctx.save();ctx.lineCap='round';
    for(let i=0;i<5;i++){
      ctx.globalAlpha=0.30-i*0.05;ctx.strokeStyle=ORANGE;ctx.lineWidth=4;
      const o=i*28;
      ctx.beginPath();ctx.moveTo(o+4,H);
      ctx.bezierCurveTo(W*0.06+o,H*0.88,W*0.14+o,H*0.82,W*0.22+o,H*0.72);ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.restore();

    // Orange swirl curves bottom-right
    ctx.save();ctx.lineCap='round';
    for(let i=0;i<3;i++){
      ctx.globalAlpha=0.22-i*0.05;ctx.strokeStyle=ORANGE;ctx.lineWidth=4;
      const o=i*24;
      ctx.beginPath();ctx.moveTo(W*0.88+o,H);
      ctx.bezierCurveTo(W*0.92+o,H*0.86,W*0.96+o,H*0.78,W+o,H*0.72);ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.restore();

    // Purple thin curve bottom
    ctx.save();ctx.strokeStyle=PURPLE;ctx.lineWidth=2;ctx.globalAlpha=0.3;
    ctx.beginPath();ctx.moveTo(W*0.20,H);
    ctx.bezierCurveTo(W*0.35,H*0.88,W*0.70,H*0.84,W*0.90,H*0.90);ctx.stroke();
    ctx.globalAlpha=1;ctx.restore();

    // Dot grids (purple)
    dotGrid(W*0.195,H*0.040,6,4,28,3.5,0.25);
    dotGrid(W*0.190,H*0.610,5,4,28,3.5,0.18);
  }

  // ── ORBRICK LOGO (disabled) ──

  // ── NAME (bold, center-top, purple) ──
  const hasTitle=title.length>0;
  const nameFS=H*0.115;
  const nameY=hasTitle?H*0.038:H*0.052;
  ctx.save();
  ctx.font=`800 ${nameFS}px 'Solway',Georgia,serif`;
  ctx.fillStyle=PURPLE;ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(name||'Your Name',W*0.52,nameY);
  ctx.restore();

  // ── TITLE (optional, below name) ──
  let divY=H*0.186;
  if(hasTitle){
    ctx.save();
    ctx.font=`400 ${H*0.030}px 'PT Sans',Tahoma,sans-serif`;
    ctx.fillStyle=DARK;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(title,W*0.52,nameY+nameFS*1.0);
    ctx.restore();
    divY=H*0.205;
  }

  // ── DIVIDER (purple lines + orange center dot) ──
  const dLen=W*0.125,gapD=W*0.010;
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle=PURPLE;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*0.52-gapD-dLen,divY);ctx.lineTo(W*0.52-gapD,divY);ctx.stroke();
  ctx.strokeStyle=ORANGE;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(W*0.52-gapD*0.3,divY);ctx.lineTo(W*0.52+gapD*0.3,divY);ctx.stroke();
  ctx.strokeStyle=PURPLE;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W*0.52+gapD,divY);ctx.lineTo(W*0.52+gapD+dLen,divY);ctx.stroke();
  ctx.restore();

  const cardStartY=divY+H*0.038;

  // ══════════════════════════════════════
  // ── LEFT COLUMN: UKOUG BADGE CARDS ──
  // Layout: [circle with wreath+icon] [text block right-of-circle]
  // ══════════════════════════════════════
  const BX=W*0.025;       // card left edge
  const BW=W*0.240;       // card width
  const BH=H*0.155;       // card height
  const BGAP=H*0.016;     // gap between cards
  const circR=BH*0.38;    // wreath circle radius
  const circPad=BW*0.016; // padding from card left to circle center

  getBadges().forEach((badge,i)=>{
    const by=cardStartY+i*(BH+BGAP);
    const cy=by+BH/2;

    // Card background
    rr(BX,by,BW,BH,14);
    ctx.fillStyle='rgba(250,248,244,0.92)';ctx.fill();

    // Circle center
    const ccx=BX+circPad+circR;

    // Purple tinted circle background
    ctx.save();
    ctx.fillStyle='rgba(91,42,134,0.06)';
    ctx.beginPath();ctx.arc(ccx,cy,circR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(91,42,134,0.12)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(ccx,cy,circR*0.96,0,Math.PI*2);ctx.stroke();
    ctx.restore();

    // Wreath image (purple tinted, drawn into circle area)
    if(tintedBadges&&tintedBadges[i]){
      const wSz=circR*2.20;
      ctx.drawImage(tintedBadges[i],ccx-wSz/2,cy-wSz/2,wSz,wSz);
    }

    // Icon in center of circle
    badgeIcon(ccx,cy,circR,BADGE_ICONS[i]);

    // ── Text block (to the right of the circle) ──
    const TX=ccx+circR+BW*0.04;

    ctx.save();ctx.textAlign='left';ctx.textBaseline='top';

    // "UKOUG"
    ctx.font=`700 ${H*0.020}px 'PT Sans',Tahoma,sans-serif`;
    ctx.fillStyle=PURPLE;
    ctx.fillText(badge.label,TX,by+BH*0.10);

    // Description lines
    ctx.font=`400 ${H*0.0172}px 'PT Sans',Tahoma,sans-serif`;
    ctx.fillStyle=DARK;
    ctx.fillText(badge.line1,TX,by+BH*0.30);
    if(badge.line2) ctx.fillText(badge.line2,TX,by+BH*0.47);

    // Bold year (orange)
    ctx.font=`700 ${H*0.0172}px 'PT Sans',Tahoma,sans-serif`;
    ctx.fillStyle=ORANGE;
    ctx.fillText(badge.bold,TX,badge.line2?by+BH*0.64:by+BH*0.47);

    ctx.restore();

    // Thin purple divider line under text
    ctx.save();ctx.strokeStyle=PURPLE;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(TX,by+BH*0.84);ctx.lineTo(TX+BW*0.48,by+BH*0.84);ctx.stroke();
    ctx.restore();
  });

  // ═══════════════════════════════════════
  // ── RIGHT COLUMN: STAT CARDS ──
  // Layout: [orange circle with icon] [number + desc right-of-circle]
  // ═══════════════════════════════════════
  const SX=W*0.720;       // card left edge
  const SW=W*0.252;       // card width
  const SH=H*0.155;       // card height (same as badge)
  const SGAP=H*0.016;
  const sCircR=SH*0.36;   // stat circle radius

  getStats().forEach((stat,i)=>{
    const sy=cardStartY+i*(SH+SGAP);
    const cy=sy+SH/2;

    // Card background
    rr(SX,sy,SW,SH,14);
    ctx.fillStyle='rgba(250,248,244,0.92)';ctx.fill();

    // Orange circle center
    const scx=SX+SW*0.016+sCircR;

    // Orange circle bg + ring
    ctx.save();
    ctx.fillStyle='rgba(240,133,25,0.06)';
    ctx.beginPath();ctx.arc(scx,cy,sCircR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=ORANGE;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(scx,cy,sCircR*0.92,0,Math.PI*2);ctx.stroke();
    ctx.restore();

    // Icon inside circle
    statIcon(scx,cy,sCircR,STAT_ICONS[i]);

    // ── Number + description right of circle ──
    const TX2=scx+sCircR+SW*0.04;

    ctx.save();ctx.textAlign='left';ctx.textBaseline='top';

    // Big number (orange, bold)
    const numFS=H*0.050;
    ctx.font=`800 ${numFS}px 'Solway',Georgia,serif`;
    ctx.fillStyle=ORANGE;
    ctx.fillText(stat.num,TX2,sy+SH*0.08);

    // Description lines
    ctx.font=`400 ${H*0.016}px 'PT Sans',Tahoma,sans-serif`;
    ctx.fillStyle=DARK;
    const descLines=wrapText(stat.descText||'',SX+SW-TX2);
    descLines.forEach((ln,li)=>{
      ctx.fillText(ln,TX2,sy+SH*0.08+numFS*0.92+li*H*0.020);
    });

    ctx.restore();
  });
}

initThumbnails();
document.getElementById('bg-upload').addEventListener('change',function(){const file=this.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>addBackground(e.target.result);reader.readAsDataURL(file);this.value='';});
document.getElementById('inp-name').addEventListener('input',render);
document.getElementById('inp-title').addEventListener('input',render);
[...document.querySelectorAll('[id^="stat-"],[id^="badge-"]')].forEach(el=>el.addEventListener('input',render));
document.getElementById('btn-dl').addEventListener('click',()=>{
  const name=document.getElementById('inp-name').value.trim()||'background';
  const a=document.createElement('a');
  a.download=`orbrick-bg-${name.replace(/\s+/g,'_')}.png`;
  a.href=CV.toDataURL('image/png',1.0);a.click();
});

document.fonts.ready.then(render);
